# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
cxf     = "4.1.3"
logback = "1.5.18"
jms-api = "3.1.0"
jms-imp = "2.41.0"
gson    = "2.13.1"

[libraries]
google-gson         = { module = "com.google.code.gson:gson", version.ref = "gson" }
jakarta-jms-api     = { module="jakarta.jms:jakarta.jms-api", version.ref="jms-api" }
activemq-jms-imp    = { module="org.apache.activemq:artemis-jakarta-client", version.ref="jms-imp" }
apache-cxf-core     = { module = "org.apache.cxf:cxf-core", version.ref = "cxf"}
apache-cxf-http     = { module = "org.apache.cxf:cxf-rt-transports-http", version.ref = "cxf"}
apache-cxf-jaxws    = { module = "org.apache.cxf:cxf-rt-frontend-jaxws", version.ref = "cxf" }
apache-cxf-logging  = { module = "org.apache.cxf:cxf-rt-features-logging",version.ref = "cxf"}
logback-core        = { module = "ch.qos.logback:logback-core", version.ref = "logback" }
logback-classic     = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

[bundles]
cxf-soap-client = ["apache-cxf-core", "apache-cxf-jaxws", "apache-cxf-http"]
cxf-logback     = ["apache-cxf-logging", "logback-core", "logback-classic"]